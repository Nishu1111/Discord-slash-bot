{% extends "dashboard/base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<h2>Admin login</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <input
        type="hidden"
        name="next"
        value="{{ next }}"
    >

    <button type="submit">
        Sign in
    </button>
</form>

{% if form.errors %}
    <p>
        Invalid username or password.
    </p>
{% endif %}

{% endblock %}
